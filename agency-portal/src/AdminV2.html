<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <?!= include('StyleV2'); ?>
  <style>body{padding-bottom:48px}</style>
</head>
<body>

<div class="hd adm-hd">
  <div class="wrap admin hd-row">
    <div>
      <div class="co">ADMIN CONSOLE</div>
      <h1 id="hdName"></h1>
      <div class="rule"></div>
    </div>
    <div style="display:flex;gap:7px">
      <a class="ghost-btn" id="btnSheet" href="#" target="_blank" rel="noopener">スプレッドシート</a>
      <button class="ghost-btn" id="btnRefresh" type="button">更新</button>
    </div>
    <div class="tiny" id="syncedAt" style="position:absolute;right:16px;top:calc(58px + env(safe-area-inset-top));color:rgba(255,255,255,.62)"></div>
  </div>
</div>

<div class="tabs" id="tabs">
  <button type="button" data-t="dash" class="on">ダッシュボード</button>
  <button type="button" data-t="ref">紹介一覧</button>
  <button type="button" data-t="ag">代理店</button>
  <button type="button" data-t="nt">お知らせ・LP</button>
  <button type="button" data-t="bf">説明会日程</button>
  <button type="button" data-t="tp">文面テンプレート</button>
</div>

<div class="wrap admin" id="view" style="padding-top:20px"></div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-hd"><h2 id="sheetTitle"></h2><button class="x" id="sheetClose" type="button">×</button></div>
  <div class="sheet-bd" id="sheetBody"></div>
  <div class="sheet-ft" id="sheetFoot"></div>
</div>

<div class="toast" id="toast"></div>
<div class="veil" id="veil"><div class="spin"></div><div class="msg" id="veilMsg"></div></div>

<script>
var BOOT = <?!= boot ?>;
var TOKEN = BOOT.token;
var state = { board: BOOT, tab: 'dash', f: { agency:'all', kind:'all', status:'all', q:'' }, draft: {}, mode: null };

function $(id){ return document.getElementById(id); }
function h(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function veil(on,msg){ $('veilMsg').textContent = msg||''; $('veil').classList.toggle('on', !!on); }
var toastTimer=null;
function toast(msg,isErr){
  var t=$('toast'); t.textContent=msg; t.classList.toggle('err',!!isErr); t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('on'); }, isErr?4200:2600);
}
function b(){ return state.board; }
function opts(){ return b().options; }
function isPartner(r){ return r.kind === opts().kinds[1]; }
function statusStyle(s){
  var c = (opts().statusColors||{})[s] || { bg:'#f1efe9', fg:'#6e685e' };
  return 'background:'+c.bg+';color:'+c.fg;
}
function missingOf(r){
  var o=opts(), out=[];
  for (var i=0;i<o.requiredKeys.length;i++){
    var k=o.requiredKeys[i];
    if (!String(r[k]||'').trim()) out.push(o.requiredLabels[k]||k);
  }
  return out;
}
function call(fn,args,onDone,msg){
  veil(true,msg);
  var r = google.script.run
    .withSuccessHandler(function(res){ veil(false); state.board=res; render(); if(onDone) onDone(res); })
    .withFailureHandler(function(err){ veil(false); toast((err&&err.message)?err.message:'通信に失敗しました', true); });
  r[fn].apply(r,args);
}
function copyText(text){
  var done=function(){ toast('コピーしました'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fb); else fb();
  function fb(){
    var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('コピーできませんでした',true); }
    document.body.removeChild(ta);
  }
}
function openSheet(on){
  $('mask').classList.toggle('on',on); $('sheet').classList.toggle('on',on);
  document.body.style.overflow = on ? 'hidden' : '';
}
function inp(key,label,value,opt){
  return '<div class="f"><label>'+h(label)+(opt?'<span class="opt">'+h(opt)+'</span>':'')+
    '</label><input id="f_'+key+'" type="text" value="'+h(value===undefined?'':value)+'"></div>';
}
function sel(key,label,pairs,value,opt){
  return '<div class="f"><label>'+h(label)+(opt?'<span class="opt">'+h(opt)+'</span>':'')+'</label><select id="f_'+key+'">'+
    pairs.map(function(p){ return '<option value="'+h(p[0])+'"'+(String(value)===String(p[0])?' selected':'')+'>'+h(p[1])+'</option>'; }).join('')+
    '</select></div>';
}
function area(key,label,value,opt){
  return '<div class="f"><label>'+h(label)+(opt?'<span class="opt">'+h(opt)+'</span>':'')+
    '</label><textarea id="f_'+key+'">'+h(value===undefined?'':value)+'</textarea></div>';
}
function bindCopy(root){
  Array.prototype.forEach.call((root||$('view')).querySelectorAll('[data-copy]'), function(x){
    x.onclick=function(e){ e.stopPropagation(); copyText(x.getAttribute('data-copy')); };
  });
  Array.prototype.forEach.call((root||$('view')).querySelectorAll('a[href]'), function(x){
    x.onclick=function(e){ e.stopPropagation(); };
  });
}

/* ================= render ================= */
function render(){
  $('hdName').textContent = b().company + ' 代理店ポータル 管理画面';
  $('btnSheet').href = b().sheetUrl || '#';
  Array.prototype.forEach.call($('tabs').children, function(x){
    x.classList.toggle('on', x.getAttribute('data-t') === state.tab);
  });
  ({ dash:renderDash, ref:renderRefs, ag:renderAgencies, nt:renderNotices, bf:renderBriefings, tp:renderTemplates })[state.tab]();
}

/* ---------------- dashboard ---------------- */
function renderDash(){
  var rs = b().referrals;
  var cnt = function(f){ var c=0; for (var i=0;i<rs.length;i++) if (f(rs[i])) c++; return c; };
  var by = {};
  opts().statuses.forEach(function(s){ by[s] = cnt(function(r){ return r.status===s; }); });

  var kpis = [
    ['総紹介数', rs.length, ''],
    ['稼働中', by['稼働中']||0, 'ok'],
    ['商談中', by['商談中']||0, 'wa'],
    ['アプローチ中', by['アプローチ中']||0, 'wa'],
    ['新規（未着手）', by['新規']||0, 'wa'],
    ['失注', by['失注']||0, 'ng'],
    ['情報不足', cnt(function(r){ return missingOf(r).length>0; }), 'ng'],
    ['説明会 予約確定', cnt(function(r){ return r.briefing==='予約確定'; }), ''],
    ['お客様紹介', cnt(function(r){ return !isPartner(r); }), ''],
    ['代理店紹介', cnt(function(r){ return isPartner(r); }), ''],
    ['代理店数（有効）', b().agencies.filter(function(a){ return a.active!=='停止'; }).length, '']
  ];
  var html = '<div class="sec-hd"><h2>全体サマリ</h2></div><div class="kpis">' +
    kpis.map(function(k){ return '<div class="'+k[2]+'"><div class="n">'+k[1]+'</div><div class="l">'+h(k[0])+'</div></div>'; }).join('') +
    '</div>';

  var statuses = opts().statuses;
  html += '<div class="sec"><div class="sec-hd"><h2>代理店別の内訳（稼働中の多い順）</h2></div>' +
    '<div class="scroll-x"><table class="tbl"><thead><tr><th>代理店</th><th>基本%</th><th>お客様</th><th>代理店候補</th>' +
    statuses.map(function(s){ return '<th>'+h(s)+'</th>'; }).join('') + '<th>情報不足</th><th>合計</th></tr></thead><tbody>';

  b().agencies.map(function(a){
    var mine = rs.filter(function(r){ return r.agencyId===a.id; });
    return { a:a, mine:mine, active: mine.filter(function(r){ return r.status==='稼働中'; }).length };
  }).sort(function(x,y){ return y.active-x.active || y.mine.length-x.mine.length; })
    .forEach(function(d){
      var mine = d.mine;
      html += '<tr class="clickable" data-agency="'+h(d.a.id)+'">' +
        '<td><b>'+h(d.a.name)+'</b>'+(d.a.active==='停止'?' <span class="tag line">停止</span>':'')+'</td>' +
        '<td class="n">'+h(d.a.rate)+'%</td>' +
        '<td class="n">'+(mine.filter(function(r){ return !isPartner(r); }).length||'')+'</td>' +
        '<td class="n">'+(mine.filter(function(r){ return isPartner(r); }).length||'')+'</td>' +
        statuses.map(function(s){
          var v = mine.filter(function(r){ return r.status===s; }).length;
          return '<td class="n'+(s==='稼働中'&&v>0?' hl':'')+'">'+(v||'')+'</td>';
        }).join('') +
        '<td class="n">'+(mine.filter(function(r){ return missingOf(r).length>0; }).length||'')+'</td>' +
        '<td class="n">'+mine.length+'</td></tr>';
    });
  html += '</tbody></table></div><p class="tiny" style="margin-top:10px">行をクリックすると、その代理店の紹介一覧に移動します。同じ集計はスプレッドシートの［ダッシュボード］シートにも入っています。</p></div>';

  $('view').innerHTML = html;
  Array.prototype.forEach.call($('view').querySelectorAll('[data-agency]'), function(tr){
    tr.onclick = function(){
      state.f = { agency: tr.getAttribute('data-agency'), kind:'all', status:'all', q:'' };
      state.tab='ref'; render();
    };
  });
}

/* ---------------- referrals ---------------- */
function filteredRefs(){
  var f = state.f, q = f.q.trim().toLowerCase();
  return b().referrals.filter(function(r){
    if (f.agency!=='all' && r.agencyId!==f.agency) return false;
    if (f.kind!=='all' && r.kind!==f.kind) return false;
    if (f.status==='__lack'){ if (!missingOf(r).length) return false; }
    else if (f.status!=='all' && r.status!==f.status) return false;
    if (q){
      var hay=[r.name,r.company,r.email,r.phone,r.detail,r.memo,r.agencyName].join(' ').toLowerCase();
      if (hay.indexOf(q)<0) return false;
    }
    return true;
  }).sort(function(x,y){ return String(y.createdAt).localeCompare(String(x.createdAt)); });
}

function renderRefs(){
  var f = state.f;
  $('view').innerHTML = '<div class="filters">' +
    '<select id="fAgency"><option value="all">すべての代理店</option>' +
      b().agencies.map(function(a){ return '<option value="'+h(a.id)+'"'+(f.agency===a.id?' selected':'')+'>'+h(a.name)+'</option>'; }).join('') + '</select>' +
    '<select id="fKind"><option value="all">すべての種別</option>' +
      opts().kinds.map(function(k){ return '<option value="'+h(k)+'"'+(f.kind===k?' selected':'')+'>'+h(k)+'</option>'; }).join('') + '</select>' +
    '<select id="fStatus"><option value="all">すべてのステータス</option><option value="__lack"'+(f.status==='__lack'?' selected':'')+'>情報不足のみ</option>' +
      opts().statuses.map(function(s){ return '<option value="'+h(s)+'"'+(f.status===s?' selected':'')+'>'+h(s)+'</option>'; }).join('') + '</select>' +
    '<input id="fQ" type="search" placeholder="氏名・会社名・メモなどで検索" value="'+h(f.q)+'">' +
    '<button class="btn sm" type="button" id="btnNewRef">＋ 弊社から登録</button>' +
    '</div><div id="refTable"></div>';
  $('fAgency').onchange=function(){ state.f.agency=this.value; renderRefTable(); };
  $('fKind').onchange  =function(){ state.f.kind=this.value; renderRefTable(); };
  $('fStatus').onchange=function(){ state.f.status=this.value; renderRefTable(); };
  $('fQ').oninput      =function(){ state.f.q=this.value; renderRefTable(); };
  $('btnNewRef').onclick=function(){ openRefForm(null); };
  renderRefTable();
}

/** 代理店候補の条件（管理方式・取り分・LP発行状況）を1セルにまとめる */
function termsCell(r){
  var self = String(r.rateSelf || '').trim();
  var tgt  = String(r.rateTarget || '').trim();
  var rates = '';
  if (r.ownership === opts().ownerships[1]){
    if (self !== '' || tgt !== '') rates = '紹介元 ' + (self||0) + '% / 候補 ' + (tgt||0) + '%';
  } else if (self !== ''){
    rates = '紹介元 ' + self + '%';
  }
  return h(r.ownership || '未設定') +
    (rates ? '<div class="tiny">' + h(rates) + '</div>' : '') +
    (r.partnerLp ? '<div class="tiny">LP発行済</div>' : '<div class="tiny" style="color:var(--amber)">LP未発行</div>');
}

function renderRefTable(){
  var rows = filteredRefs();
  var html = '<div class="scroll-x"><table class="tbl"><thead><tr>' +
    '<th>氏名 / 会社</th><th>種別</th><th>代理店</th><th>ステータス</th><th>条件</th><th>説明会</th><th>連絡先</th><th>情報</th><th>登録</th><th>弊社メモ</th>' +
    '</tr></thead><tbody>';
  if (!rows.length) html += '<tr><td colspan="10" style="text-align:center;color:var(--ink-3);padding:30px">該当する紹介はありません</td></tr>';
  rows.forEach(function(r){
    var miss = missingOf(r);
    html += '<tr class="clickable" data-id="'+h(r.id)+'">' +
      '<td><b>'+h(r.name||'（未入力）')+'</b><div class="tiny">'+h(r.company||'—')+(r.product?' / '+h(r.product):'')+'</div></td>' +
      '<td>'+(isPartner(r)?'代理店候補':'お客様')+'</td>' +
      '<td>'+h(r.agencyName)+'</td>' +
      '<td><span class="tag" style="'+statusStyle(r.status)+'">'+h(r.status)+'</span>'+(r.lostReason?'<div class="tiny">'+h(r.lostReason)+'</div>':'')+'</td>' +
      '<td>'+(isPartner(r) ? termsCell(r) : '—')+'</td>' +
      '<td>'+h(r.briefing||'—')+(r.briefingAt?'<div class="tiny">'+h(r.briefingAt)+'</div>':'')+'</td>' +
      '<td class="mono">'+h(r.email||'—')+'<br>'+h(r.phone||'—')+'</td>' +
      '<td>'+(miss.length?'<span class="tag warn">要追記</span><div class="tiny">'+h(miss.join('・'))+'</div>':'<span class="tag ok">OK</span>')+'</td>' +
      '<td class="tiny">'+h(String(r.createdAt).slice(0,10))+'</td>' +
      '<td class="tiny">'+h(r.memo||'')+'</td></tr>';
  });
  html += '</tbody></table></div><p class="tiny" style="margin-top:10px">'+rows.length+' 件を表示中。行をクリックすると編集できます。</p>';
  $('refTable').innerHTML = html;
  Array.prototype.forEach.call($('refTable').querySelectorAll('[data-id]'), function(tr){
    tr.onclick=function(){ openRefForm(tr.getAttribute('data-id')); };
  });
}

function openRefForm(id){
  var r=null; b().referrals.forEach(function(x){ if (x.id===id) r=x; });
  state.mode = r ? 'refEdit' : 'refNew';
  state.draft = r ? JSON.parse(JSON.stringify(r)) : {
    agencyId: state.f.agency!=='all' ? state.f.agency : (b().agencies[0]||{}).id,
    kind: opts().kinds[0], company:'', name:'', email:'', phone:'', detail:'', product:'',
    status: opts().statuses[0], lostReason:'', ownership:'', rateSelf:'', rateTarget:'',
    partnerLp:'', briefing: opts().briefingStates[0], briefingId:'', nextAction:'', memo:''
  };
  $('sheetTitle').textContent = r ? '紹介を編集' : '紹介を登録（弊社入力）';
  renderRefForm(); openSheet(true);
}

function renderRefForm(){
  var d=state.draft, o=opts(), isNew = state.mode==='refNew';
  var agency = null;
  b().agencies.forEach(function(a){ if (a.id === d.agencyId) agency = a; });
  var base = agency ? Number(agency.rate || 20) : 20;

  var html='';
  if (isNew) html += sel('agencyId','どの代理店からの紹介か', b().agencies.map(function(a){ return [a.id,a.name]; }), d.agencyId);
  else html += '<div class="f"><label>代理店</label><div>'+h(d.agencyName)+'（基本 '+h(base)+'%）</div></div>';

  html += sel('kind','種別', o.kinds.map(function(k){ return [k,k]; }), d.kind);
  html += inp('company','会社名',d.company) + inp('name','氏名',d.name) +
          inp('email','メールアドレス',d.email) + inp('phone','電話番号',d.phone);
  if (!isPartner(d)) html += sel('product','興味商材',[['','未選択']].concat(o.products.map(function(p){ return [p,p]; })),d.product);
  html += area('detail','詳しい情報',d.detail);
  html += sel('status','ステータス', o.statuses.map(function(s){ return [s,s]; }), d.status);
  if (d.status==='失注') html += sel('lostReason','失注理由',[['','未選択']].concat(o.lostReasons.map(function(s){ return [s,s]; })),d.lostReason);

  if (isPartner(d)){
    var sum = (Number(d.rateSelf)||0) + (Number(d.rateTarget)||0);
    html += '<div class="fieldset"><div class="legend">代理店候補の条件</div>' +
      sel('ownership','管理方式', o.ownerships.map(function(x){ return [x,x]; }), d.ownership) +
      '<div class="f2">' +
        '<div class="f"><label>紹介元（代理店）の取り分</label><div class="split"><input id="f_rateSelf" type="number" step="0.5" min="0" max="100" value="'+h(d.rateSelf)+'"><span class="eq">%</span></div></div>' +
        (d.ownership === o.ownerships[1]
          ? '<div class="f"><label>候補の取り分</label><div class="split"><input id="f_rateTarget" type="number" step="0.5" min="0" max="100" value="'+h(d.rateTarget)+'"><span class="eq">%</span></div></div>'
          : '<div class="f"><label>候補の取り分</label><div class="tiny" style="padding-top:11px">トスアップのため、弊社と候補の直接契約になります。</div></div>') +
      '</div>' +
      (d.ownership === o.ownerships[1]
        ? '<div class="bal '+(sum>base+0.001?'ng':'ok')+'">合計 '+sum+'% / 基本 '+base+'%</div>'
        : '<div class="tiny">トスアップ時の既定値は設定シートの「トスアップ時の紹介元マージン(%)」＝'+h(b().settings.tossRate)+'% です。</div>') +
      inp('partnerLp','この候補にお渡しするLP URL', d.partnerLp, '代理店のマイページに表示されます') +
      '</div>';
  }

  html += '<div class="fieldset"><div class="legend">説明会</div>' +
    sel('briefing','状況', o.briefingStates.map(function(s){ return [s,s]; }), d.briefing) +
    sel('briefingId','日程', [['','（未定・個別調整）']].concat(b().briefings.map(function(x){
      return [x.id, x.startAt+'　'+x.kind];
    })), d.briefingId) +
    (d.briefingAt ? '<div class="tiny">記録されている日時：'+h(d.briefingAt)+'</div>' : '') + '</div>';

  html += '<div class="f"><label>次回アクション日<span class="opt">社内</span></label><input id="f_nextAction" type="date" value="'+h(d.nextAction)+'"></div>';
  html += area('memo','弊社メモ',d.memo,'代理店には表示されません');

  if (!isNew){
    html += '<div class="panel pad" style="background:var(--card-2)">' +
      '<div class="kv"><div class="k">紹介ID</div><div class="v mono">'+h(d.id)+'</div></div>' +
      '<div class="kv"><div class="k">登録</div><div class="v">'+h(d.createdAt)+'</div></div>' +
      '<div class="kv"><div class="k">最終更新</div><div class="v">'+h(d.updatedAt)+'（'+h(d.updatedBy)+'）</div></div></div>';
  }

  $('sheetBody').innerHTML = html;
  $('sheetFoot').innerHTML = '<button class="btn plain" type="button" id="btnCancel">閉じる</button><button class="btn" type="button" id="btnSave">保存</button>';
  ['kind','status','ownership','agencyId'].forEach(function(k){
    var el=$('f_'+k); if (el) el.onchange=function(){ collectRef(); renderRefForm(); };
  });
  ['rateSelf','rateTarget'].forEach(function(k){
    var el=$('f_'+k); if (el) el.oninput=function(){ collectRef(); renderRefForm(); var e2=$('f_'+k); if(e2) e2.focus(); };
  });
  $('btnCancel').onclick=function(){ openSheet(false); };
  $('btnSave').onclick=function(){
    collectRef();
    var d2=state.draft;
    if (!String(d2.name).trim()){ toast('氏名を入力してください',true); return; }
    if (state.mode==='refNew') call('apiAdminCreateReferral',[TOKEN,d2.agencyId,d2],function(){ openSheet(false); toast('登録しました'); },'登録しています');
    else call('apiAdminUpdateReferral',[TOKEN,d2.id,d2],function(){ openSheet(false); toast('保存しました'); },'保存しています');
  };
}
function collectRef(){
  ['agencyId','kind','company','name','email','phone','detail','product','status','lostReason',
   'ownership','rateSelf','rateTarget','partnerLp','briefing','briefingId','nextAction','memo'].forEach(function(k){
    var el=$('f_'+k); if (el) state.draft[k]=el.value;
  });
}

/* ---------------- agencies ---------------- */
function renderAgencies(){
  var rs = b().referrals;
  var html = '<div class="filters"><button class="btn sm" type="button" id="btnNewAg">＋ 代理店を追加</button>' +
    '<span class="tiny" style="align-self:center">マイページURLを代理店にお渡しし、LINEのトークにピン留めしてもらってください。</span></div>' +
    '<div class="scroll-x"><table class="tbl"><thead><tr>' +
    '<th>代理店</th><th>担当者 / 連絡先</th><th>基本%</th><th>マイページURL</th><th>専用LP</th><th>紹介数</th><th>稼働中</th><th>状態</th>' +
    '</tr></thead><tbody>';
  if (!b().agencies.length) html += '<tr><td colspan="8" style="text-align:center;color:var(--ink-3);padding:30px">まだ代理店が登録されていません</td></tr>';
  b().agencies.forEach(function(a){
    var mine = rs.filter(function(r){ return r.agencyId===a.id; });
    var act = mine.filter(function(r){ return r.status==='稼働中'; }).length;
    html += '<tr class="clickable" data-ag="'+h(a.id)+'">' +

var REFRESH_API = 'apiAdminRefresh';
var PULSE_API   = 'apiAdminPulse';
var FULL_EVERY_MS = 5 * 60 * 1000;

/* ---------------- 自動更新 ----------------
 * 「変化があったか」だけを軽く確認し（apiXxxPulse）、変わっていたときだけ本体を読み直す。
 * 編集シートを開いている間は触らない（入力中の内容を消さないため）。
 */
var live = { stamp: (BOOT.stamp || null), fullAt: Date.now(), busy: false };

function markSynced(){
  var el = document.getElementById('syncedAt');
  if (!el) return;
  var d = new Date();
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  el.textContent = '最終更新 ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/** 画面を見ていて、かつ編集中でないときだけ自動更新してよい */
function liveReady(){
  return document.visibilityState === 'visible'
      && !document.getElementById('sheet').classList.contains('on');
}

function autoPull(onDone){
  if (live.busy || !liveReady()) return;
  live.busy = true;
  live.fullAt = Date.now();
  google.script.run
    .withSuccessHandler(function(res){
      live.busy = false;
      var before = state.board.referrals.length;
      state.board = res;
      if (res.stamp) live.stamp = res.stamp;
      render(); markSynced();
      if (onDone) onDone(res.referrals.length - before);
    })
    .withFailureHandler(function(){ live.busy = false; })[REFRESH_API](TOKEN);
}

function liveTick(){
  if (!liveReady() || live.busy) return;
  // 一定時間ごとには、指紋に出ない変更（お知らせ・説明会・設定の編集）も拾うため丸ごと読み直す
  if (Date.now() - live.fullAt > FULL_EVERY_MS) { autoPull(onArrived); return; }
  google.script.run
    .withSuccessHandler(function(st){
      if (live.stamp === null){ live.stamp = st; return; }
      // 問い合わせている間にタブが裏に回ったり編集を始めたりしていたら、何もしない
      if (st !== live.stamp && liveReady()) autoPull(onArrived);
    })
    .withFailureHandler(function(){})[PULSE_API](TOKEN);
}

function startLive(){
  markSynced();
  if (!BOOT.autoRefresh) return;
  setInterval(liveTick, BOOT.autoRefresh * 1000);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') liveTick();
  });
}

function onArrived(diff){
  if (diff > 0) toast('新しいご紹介が ' + diff + '件 届きました');
}

/* ---------------- boot ---------------- */
Array.prototype.forEach.call($('tabs').children, function(x){
  x.onclick=function(){ state.tab=x.getAttribute('data-t'); window.scrollTo(0,0); render(); };
});
$('mask').onclick=function(){ openSheet(false); };
$('sheetClose').onclick=function(){ openSheet(false); };
$('btnRefresh').onclick=function(){
  call('apiAdminRefresh',[TOKEN],function(res){
    live.stamp = res.stamp || live.stamp; live.fullAt = Date.now();
    markSynced(); toast('最新の状態にしました');
  },'読み込んでいます');
};
render();
startLive();
