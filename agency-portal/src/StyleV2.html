<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f4ef; --card:#ffffff; --card-2:#fbfaf7;
  --rule:#e2dcd1; --rule-soft:#eee9e0;
  --ink:#1f1e1b; --ink-2:#4d4840; --ink-3:#8c857a;
  --indigo:#1b3a5c; --indigo-d:#142c46; --indigo-l:#eaeff5;
  --green:#2f5d3f; --green-l:#e8efe8;
  --amber:#8a5a1e; --amber-l:#fbf1de;
  --red:#a8452c; --red-l:#fbeae5;
  --plum:#5b4b8a; --plum-l:#eeebf6;
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
a{color:var(--indigo)}
h1,h2,h3{margin:0;line-height:1.45;font-weight:600}
input,select,textarea,button{font-family:inherit;font-size:16px;color:inherit}
.mincho{font-family:var(--serif)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
.hd{
  background:var(--card);border-bottom:1px solid var(--rule);
  padding:calc(13px + env(safe-area-inset-top)) 0 12px;position:sticky;top:0;z-index:30;
}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd .co{font-size:10.5px;letter-spacing:.18em;color:var(--ink-3);font-weight:700}
.hd h1{font-family:var(--serif);font-size:19px;font-weight:600;margin-top:3px;letter-spacing:.01em}
.hd .rule{width:26px;height:2px;background:var(--indigo);margin-top:8px}
.ghost-btn{
  background:transparent;border:1px solid var(--rule);border-radius:4px;
  padding:7px 12px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;white-space:nowrap;
}
.ghost-btn:active{background:var(--card-2)}

/* ---------- structure ---------- */
.sec{margin-top:26px}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px}
.sec-hd h2{font-family:var(--serif);font-size:15.5px;letter-spacing:.02em}
.sec-hd .more{font-size:12px;color:var(--ink-3);font-weight:700;background:none;border:0;cursor:pointer}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:3px}
.pad{padding:16px}
.muted{color:var(--ink-2);font-size:13px;line-height:1.8}
.tiny{color:var(--ink-3);font-size:11.5px}
hr.hair{border:0;border-top:1px solid var(--rule-soft);margin:0}

/* ---------- goal ---------- */
.goal{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:17px 16px 15px}
.goal .lead{font-family:var(--serif);font-size:14px;color:var(--ink-2)}
.goal .big{font-family:var(--serif);font-size:15px;margin-top:5px;line-height:1.5}
.goal .big b{font-size:30px;color:var(--indigo);margin:0 3px;font-weight:700}
.goal .bar{height:7px;background:var(--rule-soft);border-radius:99px;margin-top:13px;overflow:hidden;display:flex}
.goal .bar i{display:block;background:linear-gradient(90deg,var(--indigo),#3a6a9a);border-radius:99px;transition:width .5s ease}
.goal .ticks{display:flex;justify-content:space-between;margin-top:6px}
.goal .ticks span{font-size:10.5px;color:var(--ink-3);font-weight:700}
.goal.done{border-color:var(--green);background:var(--green-l)}
.goal.done .big b{color:var(--green)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--rule);border-radius:3px}
.stats div{padding:13px 6px;text-align:center;border-left:1px solid var(--rule-soft)}
.stats div:first-child{border-left:0}
.stats .n{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.2}
.stats .l{font-size:10.5px;color:var(--ink-3);font-weight:700;margin-top:3px}
.stats .ok .n{color:var(--green)} .stats .wa .n{color:var(--amber)} .stats .ng .n{color:var(--red)}

/* ---------- notice bar ---------- */
.flag{
  display:flex;gap:11px;align-items:flex-start;background:var(--amber-l);
  border:1px solid #ecdcbd;border-left:3px solid var(--amber);border-radius:3px;padding:13px 14px;
}
.flag .t{font-size:13px;color:#6d4715;font-weight:700;line-height:1.7}
.flag button{
  margin-left:auto;background:var(--card);border:1px solid #e0cba6;color:#6d4715;
  border-radius:3px;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;align-self:center;
}

/* ---------- chips / segmented ---------- */
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--card)}
.seg button{
  flex:1;border:0;border-left:1px solid var(--rule);background:transparent;padding:10px 6px;
  font-size:13px;font-weight:700;color:var(--ink-3);cursor:pointer;
}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--indigo);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--rule);background:var(--card);color:var(--ink-2);border-radius:99px;
  padding:6px 13px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;flex:0 0 auto;
}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- list ---------- */
.rows{background:var(--card);border:1px solid var(--rule);border-radius:3px}
.row{padding:14px 15px;border-top:1px solid var(--rule-soft);cursor:pointer;position:relative}
.row:first-child{border-top:0}
.row:active{background:var(--card-2)}
.row .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .nm{font-family:var(--serif);font-size:16px;font-weight:600}
.row .l2{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.row .l3{margin-top:9px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.tag{border-radius:2px;padding:2px 8px;font-size:10.5px;font-weight:700;line-height:1.7;white-space:nowrap}
.tag.cus{background:var(--indigo-l);color:var(--indigo)}
.tag.par{background:var(--plum-l);color:var(--plum)}
.tag.warn{background:var(--amber-l);color:var(--amber)}
.tag.ok{background:var(--green-l);color:var(--green)}
.tag.line{background:var(--card);border:1px solid var(--rule);color:var(--ink-3)}
.blank{text-align:center;color:var(--ink-3);font-size:13px;padding:40px 16px;background:var(--card);border:1px dashed var(--rule);border-radius:3px}

/* ---------- key/value ---------- */
.kv{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--rule-soft);font-size:13.5px}
.kv:first-child{border-top:0}
.kv .k{flex:0 0 92px;color:var(--ink-3);font-size:12px;font-weight:700;padding-top:2px}
.kv .v{flex:1;white-space:pre-wrap;word-break:break-word}

/* ---------- url block ---------- */
.url{
  display:block;background:var(--card-2);border:1px solid var(--rule-soft);border-radius:3px;
  padding:10px 11px;font-size:11.5px;color:var(--ink-2);word-break:break-all;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.65;
}
.btns{display:flex;gap:8px;margin-top:11px}
.btn{
  flex:1;border:1px solid var(--indigo);background:var(--indigo);color:#fff;border-radius:3px;
  padding:11px;font-size:13.5px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{background:var(--indigo-d)}
.btn.line{background:var(--card);color:var(--indigo)}
.btn.plain{background:var(--card);border-color:var(--rule);color:var(--ink-2)}
.btn.danger{background:var(--card);border-color:#e2bfb4;color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:7px 12px;font-size:12px;flex:0 0 auto}

/* ---------- notices ---------- */
.note-item{padding:15px;border-top:1px solid var(--rule-soft)}
.note-item:first-child{border-top:0}
.note-item .k{font-size:10px;letter-spacing:.12em;color:var(--indigo);font-weight:700}
.note-item .t{font-family:var(--serif);font-size:15px;font-weight:600;margin-top:4px}
.note-item .b{font-size:13px;color:var(--ink-2);margin-top:5px;white-space:pre-wrap}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);
  border-top:1px solid var(--rule);display:flex;padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:saturate(180%) blur(8px);
}
.nav button{
  flex:1;border:0;background:none;padding:9px 2px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);
}
.nav .ic{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav .lb{font-size:10px;font-weight:700;letter-spacing:.02em}
.nav button.on{color:var(--indigo)}
.nav button.on .lb{color:var(--indigo)}
.fab{
  position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:41;
  background:var(--indigo);color:#fff;border:0;border-radius:99px;padding:13px 21px;
  font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(27,58,92,.28);
}
.fab:active{background:var(--indigo-d)}

/* ---------- sheet ---------- */
.mask{position:fixed;inset:0;background:rgba(31,30,27,.42);z-index:50;display:none}
.mask.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);
  border-radius:10px 10px 0 0;max-height:93vh;display:none;flex-direction:column;
  box-shadow:0 -8px 40px rgba(31,30,27,.22);
}
.sheet.on{display:flex}
.sheet-hd{padding:16px 18px 12px;border-bottom:1px solid var(--rule-soft);display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-hd h2{font-family:var(--serif);font-size:16.5px}
.sheet-bd{padding:16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-ft{padding:12px 18px calc(15px + env(safe-area-inset-bottom));border-top:1px solid var(--rule-soft);display:flex;gap:8px;background:var(--card)}
.x{background:var(--card-2);border:1px solid var(--rule);border-radius:3px;width:31px;height:31px;font-size:16px;color:var(--ink-3);cursor:pointer;flex:0 0 auto}

/* ---------- form ---------- */
.f{margin-bottom:15px}
.f>label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px;letter-spacing:.02em}
.f label .req{color:var(--red);font-size:10.5px;margin-left:5px}
.f label .opt{color:var(--ink-3);font-size:10.5px;font-weight:700;margin-left:5px}
.f input,.f select,.f textarea{
  width:100%;border:1px solid var(--rule);border-radius:3px;padding:11px 12px;background:var(--card);outline:none;
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--indigo);box-shadow:0 0 0 2px rgba(27,58,92,.1)}
.f textarea{min-height:100px;resize:vertical;line-height:1.75}
.f .hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.65}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pick button{border:1px solid var(--rule);background:var(--card);border-radius:3px;padding:13px 12px;text-align:left;cursor:pointer}
.pick button.on{border-color:var(--indigo);background:var(--indigo-l);box-shadow:inset 0 0 0 1px var(--indigo)}
.pick .t{font-family:var(--serif);font-size:13.5px;font-weight:600;display:block}
.pick .d{font-size:11px;color:var(--ink-3);display:block;margin-top:3px;line-height:1.55}
.fieldset{border:1px solid var(--rule);border-radius:3px;padding:14px;margin-bottom:16px;background:var(--card-2)}
.fieldset>.legend{font-family:var(--serif);font-size:13.5px;font-weight:600;margin-bottom:11px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.split{display:flex;align-items:center;gap:8px}
.split .eq{color:var(--ink-3);font-size:12px;font-weight:700}
.bal{font-size:12px;font-weight:700;margin-top:8px}
.bal.ok{color:var(--green)} .bal.ng{color:var(--red)}

/* ---------- copy composer ---------- */
.result{border:1px solid var(--rule);border-radius:3px;background:var(--card);margin-bottom:11px}
.result .rh{padding:11px 14px;border-bottom:1px solid var(--rule-soft);display:flex;align-items:center;gap:9px}
.result .rh .a{font-family:var(--serif);font-size:13.5px;font-weight:600}
.result .rb{padding:14px;white-space:pre-wrap;font-size:13.5px;line-height:1.85;color:var(--ink)}
.result .rf{padding:0 14px 13px}
.engine{font-size:11.5px;color:var(--ink-3);margin-bottom:12px;line-height:1.7}

/* ---------- toast / veil ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;padding:11px 19px;border-radius:3px;font-size:13px;font-weight:700;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;line-height:1.6;
}
.toast.on{opacity:.97}
.toast.err{background:var(--red)}
.veil{position:fixed;inset:0;background:rgba(246,244,239,.72);z-index:70;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.veil.on{display:flex}
.spin{width:26px;height:26px;border:2px solid var(--rule);border-top-color:var(--indigo);border-radius:50%;animation:sp .8s linear infinite}
.veil .msg{font-size:12.5px;color:var(--ink-2);font-weight:700}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- admin ---------- */
.adm-hd{background:var(--ink);color:#fff;border:0}
.adm-hd .co{color:rgba(255,255,255,.62)}
.adm-hd h1{color:#fff}
.adm-hd .rule{background:#c8b98f}
.adm-hd .ghost-btn{border-color:rgba(255,255,255,.3);color:#fff}
.tabs{display:flex;gap:0;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
.tabs button{
  border:0;background:none;padding:13px 15px;font-size:13px;font-weight:700;color:var(--ink-3);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
}
.tabs button.on{color:var(--indigo);border-bottom-color:var(--indigo)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card)}
.tbl th,.tbl td{border-bottom:1px solid var(--rule-soft);padding:10px 11px;text-align:left;vertical-align:top}
.tbl th{background:var(--card-2);font-size:11px;color:var(--ink-3);font-weight:700;white-space:nowrap;position:sticky;top:0}
.tbl tr:hover td{background:var(--card-2)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.scroll-x{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;background:var(--card)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--rule);border-radius:3px;padding:8px 10px;font-size:13px;background:var(--card)}
.filters input{min-width:200px;flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.kpis div{background:var(--card);padding:13px 9px;text-align:center}
.kpis .n{font-family:var(--serif);font-size:22px;font-weight:700}
.kpis .l{font-size:10.5px;color:var(--ink-3);font-weight:700;margin-top:2px}
.kpis .ok .n{color:var(--green)} .kpis .wa .n{color:var(--amber)} .kpis .ng .n{color:var(--red)}
.hl{background:var(--green-l);color:var(--green);font-weight:700}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;word-break:break-all}
.clickable{cursor:pointer}
@media(min-width:760px){ .wrap.admin{max-width:1180px} .f2{grid-template-columns:1fr 1fr} }
</style>
