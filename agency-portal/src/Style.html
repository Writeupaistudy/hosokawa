<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --line:#e4e7ec; --line-soft:#eef0f4;
  --text:#1b1f27; --muted:#6b7280; --muted2:#9aa1ac;
  --primary:#1a56c4; --primary-dark:#134099; --primary-soft:#e8f0fe;
  --danger:#b3261e; --danger-soft:#fde8e8;
  --ok:#137a3d; --ok-soft:#e3f6e9;
  --warn:#a55a00; --warn-soft:#fff4e0;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
a{color:var(--primary)}
h1,h2,h3{margin:0;line-height:1.4}
input,select,textarea,button{font-family:inherit;font-size:16px}

.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* ---------- header ---------- */
.appbar{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(135deg,var(--primary),#2f6fe0);
  color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 14px;
  box-shadow:0 2px 10px rgba(26,86,196,.25);
}
.appbar .eyebrow{font-size:11px;letter-spacing:.14em;opacity:.85;font-weight:700}
.appbar h1{font-size:19px;font-weight:800;margin-top:2px}
.appbar .sub{font-size:12.5px;opacity:.9;margin-top:3px}
.appbar-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.iconbtn{
  background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;
  padding:8px 11px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
}
.iconbtn:active{background:rgba(255,255,255,.32)}

/* ---------- cards / sections ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.section{margin-top:18px}
.section-title{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin:0 0 8px 2px;display:flex;align-items:center;gap:6px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
.stat .n{font-size:21px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:1px}
.stat.ok .n{color:var(--ok)} .stat.warn .n{color:var(--warn)} .stat.danger .n{color:var(--danger)}

/* ---------- alert ---------- */
.alert{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--warn-soft);border:1px solid #f2d9ac;color:#7a4300;
  border-radius:12px;padding:11px 12px;font-size:13px;font-weight:600;
}
.alert button{
  margin-left:auto;background:#fff;border:1px solid #e5c894;color:#7a4300;
  border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
}

/* ---------- segmented / chips ---------- */
.seg{display:flex;background:#e9ebef;border-radius:11px;padding:3px;gap:3px}
.seg button{
  flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;
  font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;
}
.seg button.on{background:#fff;color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;-ms-overflow-style:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line);background:#fff;color:var(--muted);
  border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;
  white-space:nowrap;cursor:pointer;flex:0 0 auto;
}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}

/* ---------- list ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;box-shadow:var(--shadow);cursor:pointer;position:relative;
}
.item:active{background:#fafbfc}
.item .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .nm{font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.item .co{font-size:12.5px;color:var(--muted);margin-top:1px}
.item .meta{font-size:11.5px;color:var(--muted2);margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}
.badge{border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;white-space:nowrap;line-height:1.5}
.badge.kind{background:var(--primary-soft);color:var(--primary)}
.badge.kind.partner{background:#efe6ff;color:#6b34c9}
.badge.lack{background:var(--warn-soft);color:var(--warn)}
.badge.done{background:var(--ok-soft);color:var(--ok)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 12px;background:var(--card);border:1px dashed var(--line);border-radius:12px}

/* ---------- LP block ---------- */
.lp{padding:13px}
.lp .u{
  display:block;background:#f3f5f8;border:1px solid var(--line-soft);border-radius:9px;
  padding:9px 10px;font-size:12px;color:var(--muted);word-break:break-all;margin:8px 0 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.row-btn{display:flex;gap:8px}
.btn{
  flex:1;border:0;border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;
  text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:active{background:var(--primary-dark)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn.subtle{background:#eef1f5;color:var(--text)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

.notice{padding:12px 13px;border-top:1px solid var(--line-soft)}
.notice:first-child{border-top:0}
.notice .k{font-size:10.5px;font-weight:800;color:var(--primary);letter-spacing:.06em}
.notice .t{font-size:14.5px;font-weight:800;margin-top:2px}
.notice .b{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap}

/* ---------- FAB ---------- */
.fab{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;
  background:var(--primary);color:#fff;border:0;border-radius:999px;
  padding:14px 26px;font-size:15px;font-weight:800;box-shadow:0 8px 24px rgba(26,86,196,.42);cursor:pointer;
}
.fab:active{background:var(--primary-dark)}

/* ---------- sheet modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:50;display:none}
.mask.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);
  border-radius:18px 18px 0 0;max-height:92vh;display:none;flex-direction:column;box-shadow:var(--shadow-lg);
}
.sheet.on{display:flex}
.sheet-head{
  padding:14px 16px 10px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.sheet-head h2{font-size:16.5px;font-weight:800}
.sheet-body{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line-soft);display:flex;gap:8px;background:var(--card);
  border-radius:0 0 18px 18px;
}
.x{background:#eef1f5;border:0;border-radius:9px;width:32px;height:32px;font-size:17px;color:var(--muted);cursor:pointer;flex:0 0 auto}

/* ---------- form ---------- */
.f{margin-bottom:13px}
.f label{display:block;font-size:12.5px;font-weight:800;color:var(--text);margin-bottom:5px}
.f label .req{color:var(--danger);font-size:11px;margin-left:4px}
.f label .opt{color:var(--muted2);font-size:11px;font-weight:700;margin-left:4px}
.f input,.f select,.f textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  background:#fff;color:var(--text);outline:none;
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,86,196,.12)}
.f textarea{min-height:96px;resize:vertical;line-height:1.6}
.f .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{
  border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 10px;
  text-align:left;cursor:pointer;color:var(--text);
}
.pick button.on{border-color:var(--primary);background:var(--primary-soft)}
.pick .t{font-size:13.5px;font-weight:800;display:block}
.pick .d{font-size:11px;color:var(--muted);display:block;margin-top:2px;line-height:1.45}
.kv{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{flex:0 0 84px;color:var(--muted);font-size:12.5px;font-weight:700;padding-top:1px}
.kv .v{flex:1;white-space:pre-wrap;word-break:break-word}
.kv .v.na{color:var(--warn);font-weight:700}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));
  background:#1b1f27;color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;
}
.toast.on{opacity:.96}
.toast.err{background:var(--danger)}

/* ---------- loading ---------- */
.veil{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:70;display:none;align-items:center;justify-content:center}
.veil.on{display:flex}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- admin only ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
.tabs button{
  border:0;background:transparent;padding:13px 14px;font-size:13.5px;font-weight:800;color:var(--muted);
  cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;
}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.tbl th,.tbl td{border-bottom:1px solid var(--line-soft);padding:9px 10px;text-align:left;vertical-align:top}
.tbl th{background:#f7f8fa;font-size:11.5px;color:var(--muted);font-weight:800;white-space:nowrap;position:sticky;top:0}
.tbl tr:hover td{background:#fafbfc}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;word-break:break-all}
.hl{background:var(--ok-soft);color:var(--ok);font-weight:800}
</style>
